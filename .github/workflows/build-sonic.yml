name: Kernel Build X00TD 4.19 (BakaSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      repo:
        required: false
        default: 'arazy79/kernel_4.19'
      branch:
        required: true
        default: 'a16-sonic'
      defconfig:
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        type: choice
        default: 'llvm'
        options: [default, llvm, gcc]
      kcflags_w:
        type: boolean
        default: false
      enable_ksu:
        type: boolean
        default: true
      bakasu_ref:
        required: true
        default: 'd5e9e025b8b49155f8014684d64c91742b465f65'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: kernel
          submodules: recursive

      - name: Setup BakaSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        id: ksu
        working-directory: kernel
        env:
          BAKASU_REF: ${{ github.event.inputs.bakasu_ref }}
        run: |
          set -e
          git clone https://github.com/arazy79/BakaSU KernelSU
          git -C KernelSU checkout "$BAKASU_REF"
          KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
          echo "short_sha=${KSU_SHA:0:8}" >> "$GITHUB_OUTPUT"
          sh KernelSU/kernel/setup.sh "$BAKASU_REF"
          [ -f drivers/kernelsu/Kconfig ] || { echo "::error::Kconfig tidak ada"; exit 1; }
          echo "OK: BakaSU terintegrasi"

      - name: Apply JackA1ltman hooks (ksu_handle_*)
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          set -e
          BUILDER_SHA=dcd789634247c77d8549a42aef232c680a905585
          RAW="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/$BUILDER_SHA/Patches"
          curl -fLSs -o /tmp/hooks.sh "$RAW/susfs_inline_hook_patches.sh"
          bash /tmp/hooks.sh ./ | tee /tmp/hook.log
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c kernel/reboot.c kernel/sys.c; do
            grep -q "ksu_" "$f" || { echo "::error::ksu hook missing di $f"; exit 1; }
          done
          echo "OK: JackA1ltman hooks terpasang"

      - name: Apply SuSFS kernel patch
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          set -e
          PATCH_FILE="susfs_x00td_419.patch"
          [ -f "$PATCH_FILE" ] || { echo "::error::$PATCH_FILE tidak ada di root kernel repo"; ls -la | head -30; exit 1; }
          echo "Pakai patch: $PATCH_FILE"
          patch -p1 --forward --no-backup-if-mismatch < "$PATCH_FILE" || true
          if find . -name "*.rej" | grep -q .; then
            echo "::warning::hunk gagal:"; find . -name "*.rej"
          fi
          [ -f fs/susfs.c ] || { echo "::error::fs/susfs.c tidak ada"; exit 1; }
          [ -f include/linux/susfs.h ] || { echo "::error::susfs.h tidak ada"; exit 1; }
          [ -f include/linux/susfs_def.h ] || { echo "::error::susfs_def.h tidak ada"; exit 1; }
          echo "OK: SuSFS kernel patch applied"

      - name: Fix missing includes (awk-based, robust)
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          set -e

          # --- fs/super.c ---
          if ! grep -q "susfs_is_sdcard_android_data_not_decrypted" fs/super.c 2>/dev/null; then
            echo "Fixing fs/super.c..."
            awk '
              /^static int thaw_super_locked/ && !done {
                print "#ifdef CONFIG_KSU_SUSFS"
                print "#include <linux/susfs_def.h>"
                print "#endif"
                print "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
                print "extern bool susfs_is_current_ksu_domain(void);"
                print "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;"
                print "#endif"
                print ""
                done = 1
              }
              { print }
            ' fs/super.c > fs/super.c.new && mv fs/super.c.new fs/super.c
          else
            echo "fs/super.c sudah OK, skip"
          fi

          # --- fs/namespace.c ---
          if ! grep -q "susfs_is_current_ksu_domain" fs/namespace.c 2>/dev/null; then
            echo "Fixing fs/namespace.c..."
            awk '
              /^unsigned int sysctl_mount_max/ && !done {
                print "#ifdef CONFIG_KSU_SUSFS"
                print "#include <linux/susfs_def.h>"
                print "#endif"
                print "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
                print "extern bool susfs_is_current_ksu_domain(void);"
                print "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;"
                print "#define CL_COPY_MNT_NS BIT(25)"
                print "#endif"
                print ""
                done = 1
              }
              { print }
            ' fs/namespace.c > fs/namespace.c.new && mv fs/namespace.c.new fs/namespace.c
          else
            echo "fs/namespace.c sudah OK, skip"
          fi

          # Verify
          grep -q "susfs_is_sdcard_android_data_not_decrypted" fs/super.c || { echo "::error::super.c fix gagal"; exit 1; }
          grep -q "susfs_is_current_ksu_domain" fs/namespace.c || { echo "::error::namespace.c fix gagal"; exit 1; }
          grep -q "susfs_def.h" fs/super.c || { echo "::error::super.c susfs_def.h gagal"; exit 1; }
          grep -q "susfs_def.h" fs/namespace.c || { echo "::error::namespace.c susfs_def.h gagal"; exit 1; }
          echo "OK: manual include fix berhasil"

          find . -name "*.rej" -delete || true

      - name: Select toolchain
        id: tc
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          case "$TOOLCHAIN" in
            llvm) echo "dir=$HOME/neutron-clang" >> "$GITHUB_OUTPUT"; echo "key=llvm-24-neutron-06092026" >> "$GITHUB_OUTPUT"; echo "out_prefix=kernel-out-llvm-" >> "$GITHUB_OUTPUT";;
            gcc)  echo "dir=$HOME/gcc-arm64" >> "$GITHUB_OUTPUT"; echo "key=gcc-eva-arm64-06052026" >> "$GITHUB_OUTPUT"; echo "out_prefix=kernel-out-gcc-" >> "$GITHUB_OUTPUT";;
            *)    echo "dir=" >> "$GITHUB_OUTPUT"; echo "key=" >> "$GITHUB_OUTPUT"; echo "out_prefix=kernel-build-" >> "$GITHUB_OUTPUT";;
          esac

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: ${{ steps.tc.outputs.out_prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.tc.outputs.out_prefix }}

      - name: Cache toolchain
        id: tc_cache
        if: ${{ github.event.inputs.toolchain != 'default' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.dir }}
          key: ${{ steps.tc.outputs.key }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld zstd wget xz-utils

      - name: Fetch toolchain
        if: ${{ github.event.inputs.toolchain != 'default' && steps.tc_cache.outputs.cache-hit != 'true' }}
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "llvm" ]; then
            mkdir -p "$HOME/neutron-clang"
            wget -q "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" -O /tmp/clang.tar.zst
            tar -xf /tmp/clang.tar.zst -C "$HOME/neutron-clang"
            rm -f /tmp/clang.tar.zst
            [ -x "$HOME/neutron-clang/bin/clang" ] || { echo "::error::clang tidak ada"; exit 1; }
          else
            cd "$HOME"
            wget -q "https://github.com/mvaisakh/gcc-build/releases/download/06052026/eva-gcc-arm64-06052026.xz" -O gcc.tar.xz
            tar -xf gcc.tar.xz
            rm -f gcc.tar.xz
            [ -d "$HOME/gcc-arm64/bin" ] || { echo "::error::gcc-arm64/bin tidak ada"; exit 1; }
          fi

      - name: Setup toolchain env
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          KCFLAGS_W: ${{ github.event.inputs.kcflags_w }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              TC="$HOME/neutron-clang"
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$TC/lib:$TC/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "TC_MAKE_ARGS=LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            gcc)
              TC="$HOME/gcc-arm64"
              prefix=""
              for p in aarch64-linux-android- aarch64-linux-gnu- aarch64-elf- aarch64-linux-; do
                if [ -f "$TC/bin/${p}gcc" ]; then prefix="$p"; break; fi
              done
              if [ -z "$prefix" ]; then echo "::error::gcc aarch64 tidak ditemukan"; exit 1; fi
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "TC_MAKE_ARGS=CROSS_COMPILE=$TC/bin/$prefix CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TC_MAKE_ARGS=CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
          esac
          if [ "$KCFLAGS_W" = "true" ] || [ "$TOOLCHAIN" = "gcc" ]; then
            echo "TC_KCFLAGS=-w" >> "$GITHUB_ENV"
          else
            echo "TC_KCFLAGS=-Wno-error" >> "$GITHUB_ENV"
          fi

      - name: Prepare output
        run: mkdir -p kernel/out

      - name: Make defconfig
        working-directory: kernel
        env:
          ENABLE_KSU: ${{ github.event.inputs.enable_ksu }}
        run: |
          cp "arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }}" out/.config
          if [ "$ENABLE_KSU" = "true" ]; then
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            } >> out/.config
          fi
          yes "" | make ARCH=${{ env.ARCH }} O=out $TC_MAKE_ARGS oldconfig
          if [ "$ENABLE_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU tidak aktif"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS tidak aktif"; exit 1; }
            grep -E '^CONFIG_KSU' out/.config
          fi

      - name: Build kernel
        working-directory: kernel
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          echo "CPU cores: $(nproc)"
          if [ "$TOOLCHAIN" != "gcc" ]; then
            make ARCH=${{ env.ARCH }} O=out $TC_MAKE_ARGS CC="ccache clang" KCFLAGS="$TC_KCFLAGS" -j"$(nproc)"
          else
            make ARCH=${{ env.ARCH }} O=out $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j"$(nproc)"
          fi

      - name: Verify KSU & SuSFS di System.map
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        continue-on-error: true
        run: |
          grep -E '^CONFIG_KSU' out/.config || true
          if grep -qi "ksu" out/System.map && grep -qi "susfs" out/System.map; then
            echo "OK: simbol ksu + susfs ada"
          else
            echo "::warning::simbol tidak ditemukan"
            exit 1
          fi

      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out $TC_MAKE_ARGS dtbs
          DTB=$(find out/arch/arm64/boot/dts -iname "*x00td*.dtb" | head -1)
          [ -z "$DTB" ] && DTB=$(find out/arch/arm64/boot/dts -name "sdm636.dtb" | head -1)
          [ -z "$DTB" ] && DTB=$(find out/arch/arm64/boot/dts -name "sdm660.dtb" | head -1)
          [ -z "$DTB" ] && { echo "::error::DTB tidak ditemukan"; exit 1; }
          echo "Using DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-X00TD-BakaSU${{ steps.ksu.outputs.short_sha && format('-{0}', steps.ksu.outputs.short_sha) || '-NOKSU' }}-${{ github.event.inputs.toolchain }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
