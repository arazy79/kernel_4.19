name: Check Config
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'repo'
        required: true
        default: 'arazy79/kernel_4.19'
      branch:
        description: 'Branch'
        required: true
        default: 'sonic-limit-tes-bek'
      defconfig_name:
        description: 'Nama file defconfig (contoh: vendor/asus/X00TD_defconfig)'
        required: true
        default: 'vendor/asus/X00TD_defconfig'
        type: string

jobs:
  check:
    name: Run make olddefconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y make gcc bc bison flex libssl-dev

      - name: Lihat daftar defconfig yang tersedia
        run: |
          echo "=== File defconfig di repo kamu ==="
          find arch/arm64/configs -name "*_defconfig" | sort

      - name: Generate .config dari defconfig
        run: |
          echo "Pakai defconfig: ${{ github.event.inputs.defconfig_name }}"
          make ARCH=arm64 ${{ github.event.inputs.defconfig_name }}

      - name: Cek KALLSYMS sebelum & sesudah olddefconfig
        run: |
          echo "=== 1. SEBELUM make olddefconfig ==="
          grep "CONFIG_KALLSYMS" .config || echo "Tidak ada di .config"

          echo ""
          echo "=== 2. Jalankan make olddefconfig ==="
          make ARCH=arm64 olddefconfig

          echo ""
          echo "=== 3. SESUDAH make olddefconfig ==="
          grep "CONFIG_KALLSYMS" .config || echo "Tidak ada di .config"

          echo ""
          echo "=== 4. Siapa yang memaksa KALLSYMS = y? ==="
          grep -rn "select KALLSYMS" --include="Kconfig*" . || echo "Tidak ada yang select KALLSYMS"
