name: Sync Folder Antar Repo
run-name: "Sync: ${{ github.event.inputs.src_repo }}@${{ github.event.inputs.src_branch }} → ${{ github.event.inputs.tgt_repo }}@${{ github.event.inputs.tgt_branch }}"

on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: 'Repo Sumber (username/nama-repo)'
        required: true
        default: 'akun-ini/repo-sumber'
      src_branch:
        description: 'Branch Sumber'
        required: true
        default: 'main'
      src_folder:
        description: 'Path Sumber (folder/file, tanpa / di akhir). Kosongkan = root repo.'
        required: false
        default: ''
      tgt_repo:
        description: 'Repo Tujuan (username/nama-repo)'
        required: true
        default: 'akun-ini/repo-tujuan'
      tgt_branch:
        description: 'Branch Tujuan'
        required: true
        default: 'target-branch'
      tgt_folder:
        description: 'Path Tujuan (tanpa / di akhir). Kosongkan = root repo.'
        required: false
        default: ''
      clean_target:
        description: 'Mirror persis? (hapus file extra di target). true = mirror, false = copy/overwrite aja'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sumber
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.src_repo }}
          ref: ${{ inputs.src_branch }}
          token: ${{ secrets.PAT_SYNC }}
          path: sumber
          fetch-depth: 1

      - name: Checkout Tujuan
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tgt_repo }}
          ref: ${{ inputs.tgt_branch }}
          token: ${{ secrets.PAT_SYNC }}
          path: tujuan
          fetch-depth: 0

      - name: Pastikan folder tujuan ada
        run: mkdir -p "./tujuan/${{ inputs.tgt_folder }}"

      - name: Salin file (rsync)
        run: |
          DELETE_FLAG=""
          if [ "${{ inputs.clean_target }}" = "true" ]; then
            DELETE_FLAG="--delete"
          fi
          rsync -av $DELETE_FLAG \
            --exclude='.git' \
            "./sumber/${{ inputs.src_folder }}/" \
            "./tujuan/${{ inputs.tgt_folder }}/"

      - name: Commit & Push
        working-directory: ./tujuan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan"
          else
            git commit -m "Sync: ${{ inputs.src_repo }}:${{ inputs.src_folder }} → ${{ inputs.tgt_repo }}:${{ inputs.tgt_folder }}"
            git push
          fi
