name: Sync Folder Antar Repo/Branch
run-name: Sync dari ${{ github.repository }}@${{ github.ref_name }} → target

on:
  push:
    branches: [ "main" ]  # sesuaikan branch pemicu kamu
    paths:
      - 'folder_sumber/**'
  workflow_dispatch:  # ✅ INI YANG BIKIN TOMBOL RUN MUNCUL!

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sumber
        uses: actions/checkout@v4
        with:
          path: sumber
          fetch-depth: 0

      - name: Checkout Tujuan
        uses: actions/checkout@v4
        with:
          repository: username-kamu/repo-tujuan  # ganti
          ref: branch-tujuan                      # ganti
          token: ${{ secrets.PAT_SYNC }}
          path: tujuan
          fetch-depth: 0

      - name: Salin & sinkron
        run: |
          rsync -av --delete ./sumber/folder_sumber/ ./tujuan/folder_tujuan/

      - name: Commit & Push
        working-directory: ./tujuan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && echo "Tidak ada perubahan" || (git commit -m "Sync folder: ${{ github.sha }}" && git push)
