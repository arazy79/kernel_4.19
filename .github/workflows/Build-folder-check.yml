name: Kernel Folder Build Check

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Repo kernel (owner/repo)'
        required: true
        default: 'arazy79/kernel_4.19'
        type: string
      kernel_branch:
        description: 'Branch kernel'
        required: true
        default: 'a16xx'
        type: string
      defconfig:
        description: 'Defconfig relatif ke arch/arm64/configs/ (prefix arch/arm64/configs/ otomatis dibuang)'
        required: true
        default: 'vendor/asus/X00TD_defconfig'
        type: string
      build_paths:
        description: 'Folder yang di-compile, pisah pakai spasi atau koma'
        required: true
        default: 'kernel/power/ drivers/cpuidle/ drivers/gpu/msm/ drivers/char/ drivers/video/fbdev/msm/ drivers/mmc/host/'
        type: string
      clang_version:
        description: 'Versi clang dari apt'
        required: true
        default: '17'
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        env:
          CV: ${{ inputs.clang_version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-$CV lld-$CV llvm-$CV \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev make ccache python3

      - name: Clone kernel
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          KREPO: ${{ inputs.kernel_repo }}
          KBRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$KBRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${KREPO}.git" kernel

      - name: Build folders (make -k)
        id: build
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          BPATHS: ${{ inputs.build_paths }}
          CV: ${{ inputs.clang_version }}
        run: |
          set +e
          mkdir -p ../logs
          : > ../logs/results.txt

          # make nyari defconfig relatif ke arch/arm64/configs/, jadi prefix itu dibuang kalau ikut ditulis
          DEFCONFIG="${DEFCONFIG#./}"
          DEFCONFIG="${DEFCONFIG#arch/arm64/configs/}"

          MK="make O=out ARCH=arm64 \
            CC=clang-$CV LD=ld.lld-$CV AR=llvm-ar-$CV NM=llvm-nm-$CV \
            OBJCOPY=llvm-objcopy-$CV OBJDUMP=llvm-objdump-$CV \
            STRIP=llvm-strip-$CV READELF=llvm-readelf-$CV \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          echo "== defconfig: $DEFCONFIG"
          $MK "$DEFCONFIG" > ../logs/defconfig.log 2>&1
          if [ $? -ne 0 ]; then
            tail -n 40 ../logs/defconfig.log
            echo "setup=defconfig" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "== prepare"
          $MK prepare > ../logs/prepare.log 2>&1
          if [ $? -ne 0 ]; then
            tail -n 40 ../logs/prepare.log
            echo "setup=prepare" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "setup=ok" >> "$GITHUB_OUTPUT"

          OVERALL=0
          for P in $(echo "$BPATHS" | tr ',' ' '); do
            P="${P#./}"; P="${P#/}"; P="${P%/}/"
            SLUG=$(echo "$P" | tr '/' '_')
            LOG="logs/build_${SLUG}log"
            echo "== build $P"
            $MK -k -j"$(nproc)" "$P" 2>&1 | tee "../$LOG"
            RC=${PIPESTATUS[0]}
            echo "${P}|${RC}|${LOG}" >> ../logs/results.txt
            [ "$RC" -ne 0 ] && OVERALL=1
          done
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ringkasan error
        if: always()
        env:
          SETUP: ${{ steps.build.outputs.setup }}
        run: |
          {
            echo "# Hasil compile folder"
            echo ""
            if [ "${SETUP:-}" = "defconfig" ]; then
              echo "defconfig gagal. Cek nama defconfig, lihat artifact logs/defconfig.log"
              exit 0
            elif [ "${SETUP:-}" = "prepare" ]; then
              echo "make prepare gagal. Lihat artifact logs/prepare.log"
              exit 0
            fi

            echo "| Folder | Exit code | Jumlah error |"
            echo "|---|---|---|"
            while IFS='|' read -r P RC LOG; do
              N=$(grep -c ': error:' "$LOG" || true)
              echo "| \`$P\` | $RC | $N |"
            done < logs/results.txt
            echo ""

            while IFS='|' read -r P RC LOG; do
              [ "$RC" = "0" ] && continue
              echo "## \`$P\`"
              echo ""
              echo "Error unik (jumlah x pesan):"
              echo '```'
              grep -E ': error:' "$LOG" | sed -E 's/.*error: //' | sort | uniq -c | sort -rn | head -n 30
              echo '```'
              echo "Error per file:"
              echo '```'
              grep -E ': error:' "$LOG" | cut -d: -f1 | sort | uniq -c | sort -rn | head -n 30
              echo '```'
              echo "Paling hulu (biasanya penyebab, bukan efek):"
              echo '```'
              grep -E 'implicit declaration|unknown type name|has no member named|undeclared|file not found' "$LOG" | sed -E 's/^[^ ]*: //' | sort | uniq -c | sort -rn | head -n 20
              echo '```'
              echo ""
            done < logs/results.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - name: Fail kalau ada folder gagal
        if: always()
        env:
          SETUP: ${{ steps.build.outputs.setup }}
          OVERALL: ${{ steps.build.outputs.overall }}
        run: |
          if [ "${SETUP:-}" != "ok" ] || [ "${OVERALL:-1}" != "0" ]; then
            echo "::error::Ada folder yang gagal compile atau setup gagal, lihat summary dan artifact build-logs"
            exit 1
          fi
